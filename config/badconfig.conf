# 00 - baseline valide-ish (pour comparer)
server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;
    root ./www/html;
    location / {
        index index.html;
        methods GET POST;
    }
}

# 01 - missing semicolons, tokens run together
server {
    listen 8080 4237   # missing semicolon
    host 127.0.0.1;     # host token glued to name
    server_name localhost
    root ./www/html;
    location / {
        index index.html
        methods GET POST;;
    }
}

# 02 - unclosed brace at EOF
server {
    listen 8081;
    host 192.168.0.1;
    root /var/www;
    location /incomplete {
        index index.html;
        methods GET;
    # missing closing } for server

# 03 - extra closing braces and stray tokens
server {
    listen 80;
    host localhost;
    } } }  # nonsense closers
stray_token_here

# 04 - nested 'server' blocks (nonsense nesting)
server {
    listen 9090;
    server { listen 9091; }
    host 127.0.0.1;
}

# 05 - directive with no value(s)
server {
    listen ;            # empty listen
    host ;
    server_name ;
}

# 06 - invalid port formats
server {
    listen eightythirty;    # non-numeric
    listen -1;              # negative
    listen 0;               # invalid/privileged or zero
    listen 70000;           # >65535
    listen 8080,8081;       # comma inside token
}

# 07 - duplicate listen in same server (allowed? test both cases)
server {
    listen 8080;
    listen 8080;  # duplicate
}

# 08 - duplicate ports across servers (global conflict)
server { listen 10000; host a; }
server { listen 10000; host b; }

# 09 - host invalid formats
server {
    listen 1234;
    host 999.999.999.999;   # out of range octets
    host abc.def;           # not a domain nor ip
    host "";                # empty string token (if parser allows quotes)
}

# 10 - directive spelled wrong / unknown directive
server {
    listenn 8082;           # typo
    allowd_size 10;         # typo
    hello world;            # unknown directive & two values
}

# 11 - directives in wrong block (semantic)
server {
    root /srv/www;
    methods GET;            # methods at server-level if you expect only in location
}

# 12 - multiple paths on location, duplicate location path
server {
    listen 3333;
    location / /dup {
        index i.html;
    }
    location / { index a; }
    location / { index b; }   # duplicate location for same path
}

# 13 - tokens that include braces or semicolon inside value
server {
    listen 8083;
    server_name some{weird;name;
    root /tmp; }; } }
}

# 14 - comment placed mid-token and inline-without-space
server {
    listen 8084; #this#is#a#comment without newlines
    host 1.2.3.4#comment without space;
    server_name host#comment;
}

# 15 - very long numeric values (overflow)
server {
    listen 18446744073709551616;  # too big for 64-bit unsigned
    allowed_size 18446744073709551616;
}

# 16 - invalid methods, case sensitivity, duplicates
server {
    listen 4444;
    location / {
        methods get POST PATCH DELETE UNKNOWN;
        methods GET GET;   # duplicate methods line
    }
}

# 17 - quoted strings, spaces inside values, missing tokenization
server {
    listen "8085";
    root "/var/www with spaces";   # parser may not support quotes
    server_name "my host";
}

# 18 - multiple semicolons / stray semicolons outside directives
server {
    ;;;;;;
    listen 5555;;;;;
    host 127.0.0.1;;;;;
}

# 19 - non-ASCII/unicode tokens
server {
    listen 6666;
    host 例え.テスト;
    server_name tésté;
}

# 20 - nested locations crazy deep
server {
    listen 7777;
    location /a {
        location /b {
            location /c {
                location /d {
                    index deep.html;
                }
            }
        }
    }
}

# 21 - directives after closing brace for a server
server {
    listen 8888;
    host 127.0.0.1;
}
listen 9999;   # stray global directive

# 22 - mixing curly and missing semicolons in weird order
server
{
    listen 1010
    host 1.1.1.1;
} ;

# 23 - identical keys with slightly different casing (case sensitivity test)
server {
    listen 2020;
    Host 2.2.2.2;
    host 2.2.2.3;
    HOST 2.2.2.4;
}

# 24 - extremely weird tokens: punctuation-only names and very long single token
server {
    %$$$ 123;
    a_very_long_directive_name_which_needs_to_be_handled_but_is_unreasonably_long_AND_TOO_LONG 1;
}

# 25 - 'location' without path and missing '{'
server {
    listen 3030;
    location { index no_path.html; }   # missing path token
}

# 26 - good-looking but duplicate server_name and inconsistent server_name types
server {
    listen 4040;
    server_name example.com;
}
server {
    listen 4041;
    server_name example.com;  # same name on different server (allowed? test)
}

# 27 - semicolons inside comments after tokens (should be ignored)
server {
    listen 5050; # ; ; ;
    host 5.5.5.5; # ; } } ;
}

# 28 - mixed separators, tabs, CRLF weirdness and inline null bytes (visual only)
server {	listen	6060;	host	6.6.6.6;	location /null { index n.html; } }␀

# 29 - values that are keywords (e.g. '{' as value)
server {
    listen {;
    host } ;
    server_name ;{
}

# 30 - huge combinatorial line: many tokens on one line, missing separators
server { listen 7070 8080 9090 10000 host 7.7.7.7 server_name many names root /; location / { index i; } }
