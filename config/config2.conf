# Minimal baseline config using Nginx-like syntax and cgi_param

server {
	listen 8080;
	host 127.0.0.1;
	server_name localhost;

	root ./www;

	# Simple static site at http://127.0.0.1:8080/
	location / {
		index index.html;
		autoindex off;
		allowed_methods GET;
	}


location /upload {
    root ./www/upload;
    index upload.html;
    autoindex on;              # optional, handy to see uploaded files
    allowed_methods GET POST DELETE;
}

	# CGI demo at http://127.0.0.1:8080/cgi
	# Requests to this location will execute the script defined by cgi_param,
	# resolved against the location/server root.
	# location /hello.py {
	# 	allowed_methods GET POST;
	# 	root ./www/cgi;          # filesystem base for the CGI script
	# 	include cgi_param;       # parsed but currently ignored by the server
	# 	cgi_param hello.py;      # script: ./www/cgi/hello.py
	# }
  location /cgi {
    allowed_methods GET POST;
    root ./www/cgi;          # filesystem base for the CGI scripts
    autoindex on;
  }

	# Simple redirect example: /old -> /
	location /old {
		allowed_methods GET;
		return 301 /index.html;
	}

	# Custom error pages (optional)
	#error_page 404 /errors/404.html;
	#error_page 403 /errors/403.html;
}
