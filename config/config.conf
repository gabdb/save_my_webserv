
# =========================
# SERVER A (static + upload + cgi + autoindex)
# =========================
server {
    host 127.0.0.1;
    listen 8080;
    server_name localhost;

    # Base root
    root ./www/site1;
    index index.html;
    autoindex off;

    # Pour tests 413 (même si ton code ne l’applique pas encore partout)
    client_max_body_size 1000000;

    # Pages d’erreur custom
    error_page 404 /errors/404.html;
    error_page 403 /errors/403.html;
    error_page 500 /errors/500.html;

    # =========
    # 1) Static normal
    # =========
    location / {
        root ./www/site1;
        index index.html;
        autoindex off;
        allowed_methods GET;
    }

    # =========
    # 2) Autoindex ON
    # =========
    location /list/ {
        root ./www/site1/list;
        autoindex on;
        allowed_methods GET;
    }

    # =========
    # 3) Upload zone (POST creates/overwrites files; DELETE removes)
    #    Vu ton handlePOST, il écrit DIRECTEMENT dans le "path" resolu,
    #    donc /upload/foo.txt => ./www/site1/upload/foo.txt (si dossier existe)
    # =========
    location /upload/ {
        root ./www/site1/upload;
        index upload.html;
        autoindex on;              # pratique pour voir les fichiers uploadés
        allowed_methods GET POST DELETE;
    }

    # =========
    # 4) CGI zone
    #    IMPORTANT : extension-based:
    #    - test.py => python3
    #    - test.php => php-cgi
    # =========
    location /cgi-bin/ {
        root ./www/site1/cgi-bin;
        autoindex off;
        allowed_methods GET POST;
    }

    # =========
    # 5) Méthode interdite exprès (pour vérifier 405)
    # =========
    location /onlyget/ {
        root ./www/site1;
        autoindex off;
        allowed_methods GET;
    }
}

# =========================
# SERVER B (autre port / autre root)
# =========================
server {
    host 127.0.0.1;
    listen 8081;
    server_name otherhost;

    root ./www/site2;
    index index.html;
    autoindex on;

    error_page 404 /errors/404.html;

    location / {
        root ./www/site2;
        autoindex on;
        allowed_methods GET;
    }
}
