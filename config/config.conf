
# SERVER 1: 8080
server {
	host 127.0.0.1;
    listen 8080;
    server_name localhost;

    root ./www/site1;
    index index.html;
    autoindex off;

    # limite body (pour tester 413)
    client_max_body_size 1000000;

    # pages d’erreur custom (si supporté)
    error_page 404 ./www/site1/errors/404.html;
    error_page 500 ./www/site1/errors/500.html;

    # static root
    location / {
        root ./www/site1;
        index index.html;
        autoindex off;
    }

    # autoindex ON pour tester listing
    location /list/ {
        root ./www/site1;
        autoindex on;
    }

    # upload POST (écrire dans un dossier)
    location /upload/ {
        root ./www/site1;
        autoindex off;
    }

    # CGI (python) : appelle /cgi/test.py
    location /cgi/ {
        root ./www/site1;
        autoindex on;
    }
}


# SERVER 2: 8081
server {
    listen 8081;
    server_name otherhost;

    root ./www/site2;
    index index.html;
    autoindex on;

    client_max_body_size 200000;
}
